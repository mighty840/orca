name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly E2E run at 06:00 UTC (~22:00 PT / 07:00 CET). Only the `e2e`
    # job below runs on schedule; check/build-arm64 are PR/push-gated.
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check, Lint, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          # ubuntu-latest ships ~14GB free; orca's dep tree + all the
          # integration-test artifacts can exhaust it ("No space left on
          # device"). Drop preinstalled SDKs we don't use to reclaim ~20GB.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Unit & integration tests
        run: cargo test
      - name: Check file sizes
        run: |
          over=$(find crates -name "*.rs" -exec wc -l {} + | sort -rn | awk '$1 > 500 && $2 != "total" {print}')
          if [ -n "$over" ]; then
            echo "Files over 500 lines:"
            echo "$over"
            exit 1
          fi

  build-arm64:
    name: Build ARM64 binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: arm64
      - name: Install cross-compiler and protoc
        run: sudo apt-get install -y gcc-aarch64-linux-gnu protobuf-compiler
      - name: Build release binary (ARM64)
        run: cargo build --release --target aarch64-unknown-linux-gnu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: orca-linux-arm64
          path: target/aarch64-unknown-linux-gnu/release/orca

  e2e:
    name: E2E Tests (nightly)
    runs-on: ubuntu-latest
    # Runs on nightly cron and on manual workflow_dispatch only. Skipped on
    # push/PR so PR latency stays unaffected by the long suite.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler
      - name: Build
        run: cargo build
      - name: E2E tests
        run: cargo test --no-fail-fast -- --ignored
        env:
          ORCA_E2E: "1"
