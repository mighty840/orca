name: Release Binaries

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          # Reclaim ~20GB of preinstalled SDKs so the release build never hits
          # "No space left on device" as the dep tree grows.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler

      - name: Build release binary
        run: cargo build --release -p mallorca

      - name: Rename binary
        run: cp target/release/orca orca-linux-x86_64

      - name: Upload to GitHub Release
        run: |
          # Create release if it doesn't exist yet (publish.yml may have created it)
          if ! gh release view "${{ github.ref_name }}" &>/dev/null; then
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes \
              --prerelease=${{ contains(github.ref_name, 'rc') }}
          fi
          gh release upload "${{ github.ref_name }}" orca-linux-x86_64 \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
